<header class="topbar">
  <div class="container topbar__inner">
    <a routerLink="/" class="logo" aria-label="QuizLab PHP — acasă">
      <img class="logo__mark" src="favicon.svg" alt="" width="32" height="32" />
      <span class="logo__text">Quiz<b>Lab</b></span>
      <span class="logo__tag">PHP</span>
    </a>

    <nav class="nav" aria-label="Navigare principală">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__link"
        >Laboratoare</a
      >
      <a routerLink="/rezultate" routerLinkActive="is-active" class="nav__link">Rezultate</a>

      <button
        type="button"
        class="btn btn--ghost btn--icon"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Activează tema light' : 'Activează tema dark'"
      >
        @if (theme.theme() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
    </nav>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<footer class="footer container">
  <p>QuizLab PHP · Programarea server-side a site-urilor Web · datele se salvează doar în browserul tău (localStorage)</p>
</footer>
